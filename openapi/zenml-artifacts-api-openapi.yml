openapi: 3.0.3
info:
  title: ZenML OSS REST Artifacts API
  version: '1'
  description: REST API for the ZenML server, exposing operations to manage pipelines, stacks, components, artifacts, models, deployments, runs, schedules, secrets, users, projects, and triggers in a self-hosted ZenML deployment. The API is consumed by the ZenML Python SDK and CLI and can also be called directly for automation and CI/CD integration.
  contact:
    name: ZenML
    url: https://docs.zenml.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://your-zenml-server.example.com/api/v1
  description: ZenML server REST API (self-hosted)
security:
- bearerAuth: []
tags:
- name: Artifacts
  description: Artifact metadata and versions produced by pipeline runs
paths:
  /artifacts:
    get:
      tags:
      - Artifacts
      summary: List Artifacts
      operationId: listArtifacts
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of artifacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactPage'
  /artifacts/{artifact_id}:
    parameters:
    - in: path
      name: artifact_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Artifacts
      summary: Get Artifact
      operationId: getArtifact
      responses:
        '200':
          description: Artifact detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'
components:
  schemas:
    ArtifactPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Artifact'
    Page:
      type: object
      properties:
        index:
          type: integer
        max_size:
          type: integer
        total_pages:
          type: integer
        total:
          type: integer
    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        type:
          type: string
        uri:
          type: string
          format: uri
        materializer:
          type: string
        producer_step_run_id:
          type: string
          format: uuid
        created:
          type: string
          format: date-time
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
