openapi: 3.0.3
info:
  title: ZenML OSS REST Artifacts Service Connectors API
  version: '1'
  description: REST API for the ZenML server, exposing operations to manage pipelines, stacks, components, artifacts, models, deployments, runs, schedules, secrets, users, projects, and triggers in a self-hosted ZenML deployment. The API is consumed by the ZenML Python SDK and CLI and can also be called directly for automation and CI/CD integration.
  contact:
    name: ZenML
    url: https://docs.zenml.io/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
- url: https://your-zenml-server.example.com/api/v1
  description: ZenML server REST API (self-hosted)
security:
- bearerAuth: []
tags:
- name: Service Connectors
  description: Connectors to external infrastructure providers
paths:
  /service_connectors:
    get:
      tags:
      - Service Connectors
      summary: List Service Connectors
      operationId: listServiceConnectors
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of service connectors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConnectorPage'
components:
  schemas:
    Page:
      type: object
      properties:
        index:
          type: integer
        max_size:
          type: integer
        total_pages:
          type: integer
        total:
          type: integer
    ServiceConnectorPage:
      allOf:
      - $ref: '#/components/schemas/Page'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceConnector'
    ServiceConnector:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connector_type:
          type: string
        auth_method:
          type: string
        resource_types:
          type: array
          items:
            type: string
        configuration:
          type: object
          additionalProperties: true
        created:
          type: string
          format: date-time
  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 20
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
