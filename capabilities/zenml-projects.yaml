naftiko: 1.0.0-alpha2
info:
  label: ZenML OSS REST API — Projects
  description: 'ZenML OSS REST API — Projects. 1 operations. Lead operation: List Projects. Self-contained Naftiko capability
    covering one Zenml business surface.'
  tags:
  - Zenml
  - Projects
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ZENML_API_KEY: ZENML_API_KEY
capability:
  consumes:
  - type: http
    namespace: zenml-projects
    baseUri: https://your-zenml-server.example.com/api/v1
    description: ZenML OSS REST API — Projects business capability. Self-contained, no shared references.
    resources:
    - name: projects
      path: /projects
      operations:
      - name: listprojects
        method: GET
        description: List Projects
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.ZENML_API_KEY}}'
  exposes:
  - type: rest
    namespace: zenml-projects-rest
    port: 8080
    description: REST adapter for ZenML OSS REST API — Projects. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/projects
      name: projects
      description: REST surface for projects.
      operations:
      - method: GET
        name: listprojects
        description: List Projects
        call: zenml-projects.listprojects
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: zenml-projects-mcp
    port: 9090
    transport: http
    description: MCP adapter for ZenML OSS REST API — Projects. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-projects
      description: List Projects
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zenml-projects.listprojects
      outputParameters:
      - type: object
        mapping: $.
