naftiko: 1.0.0-alpha2
info:
  label: ZenML OSS REST API — Secrets
  description: 'ZenML OSS REST API — Secrets. 2 operations. Lead operation: List Secrets. Self-contained Naftiko capability
    covering one Zenml business surface.'
  tags:
  - Zenml
  - Secrets
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ZENML_API_KEY: ZENML_API_KEY
capability:
  consumes:
  - type: http
    namespace: zenml-secrets
    baseUri: https://your-zenml-server.example.com/api/v1
    description: ZenML OSS REST API — Secrets business capability. Self-contained, no shared references.
    resources:
    - name: secrets
      path: /secrets
      operations:
      - name: listsecrets
        method: GET
        description: List Secrets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createsecret
        method: POST
        description: Create Secret
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.ZENML_API_KEY}}'
  exposes:
  - type: rest
    namespace: zenml-secrets-rest
    port: 8080
    description: REST adapter for ZenML OSS REST API — Secrets. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/secrets
      name: secrets
      description: REST surface for secrets.
      operations:
      - method: GET
        name: listsecrets
        description: List Secrets
        call: zenml-secrets.listsecrets
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createsecret
        description: Create Secret
        call: zenml-secrets.createsecret
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: zenml-secrets-mcp
    port: 9090
    transport: http
    description: MCP adapter for ZenML OSS REST API — Secrets. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-secrets
      description: List Secrets
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: zenml-secrets.listsecrets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-secret
      description: Create Secret
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: zenml-secrets.createsecret
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
