      name: pipelines
      description: REST surface for pipelines.
      operations:
      - method: GET
        name: listpipelines
        description: List Pipelines
        call: zenml-pipelines.listpipelines
        with:
          name: rest.name
          project_id: rest.project_id
        outputParameters:
        - type: object
          mapping: $.
