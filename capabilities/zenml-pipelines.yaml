        - name: name
          in: query
          type: string
        - name: project_id
          in: query
          type: string
      - name: createpipeline
        method: POST
        description: Create Pipeline
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
